;============================================================
; HUONG DAN CHINH LAYOUT BANG KY NANG (F5 - Ky nang vo cong)
;
; Dong bat dau bang ";" la comment, KIniFile bo qua khi doc.
;
; [SkillText] Offset=cx,cy
;   Vi tri so cap do ky nang (vd "20" duoi icon). cx/cy tinh
;   TU GOC TREN-TRAI CUA ICON SKILL tuong ung (khong phai goc
;   man hinh). Tang cx = day so sang phai, tang cy = day xuong.
;
; [Skill_0]..[Skill_24]
;   Vi tri (Left,Top) + kich thuoc (Width,Height) cua 25 o icon
;   ky nang, xep 5 cot x 5 hang. O thu i nam o hang i/5, cot i%5
;   (vd Skill_7 = hang 1, cot 2). Left/Top tinh tu goc tren-trai
;   CUA CA BANG (xem Width/Height cua bang trong [Main] o tren).
;
; [AddPointBtn_0]..[AddPointBtn_24]
;   Vi tri + kich thuoc 25 nut "+" cong diem, dung CHUNG he toa
;   do voi [Skill_N] o tren (goc tren-trai cua ca bang). O thu i
;   ung voi Skill_i cung chi so - vd AddPointBtn_7 la nut cong
;   diem cho ky nang o o Skill_7. Up/Down/DisableFrame/Image la
;   3 frame anh (binh thuong/dang bam/vo hieu hoa) cua nut, nen
;   giu nguyen, chi can sua Left/Top de doi vi tri nut.
;
; [AddPointBtn] (khong co so o cuoi)
;   Block mau goc, KHONG con duoc code doc nua (chi 25 block co
;   so o cuoi moi duoc dung). Giu lai de tham khao kich thuoc/
;   anh mac dinh khi can them o moi, khong can sua block nay.
;
; LUU Y QUAN TRONG: sua file nay xong phai COPY THU CONG sang
;   bin/client/debug/Ui/Ui3/UiSkillsFightSub.ini va
;   bin/client/release/Ui/Ui3/UiSkillsFightSub.ini
;   thi game moi doc duoc ban moi - build code KHONG tu dong
;   copy file .ini nay.
;============================================================

