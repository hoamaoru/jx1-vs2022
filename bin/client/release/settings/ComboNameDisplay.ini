[ComboNameBubble]
; RevealMode: 0=CharByChar 1=WordByWord 2=SwordSlash 3=InkBlot
RevealMode=1
; Delay (ms) before each next word/char starts flying in
CharStaggerMs=40
; Time (ms) for one word/char to fly into place
CharFlyMs=180
; World-height units a word/char travels while flying in
FlyDistance=15
; Time (ms) for the size+color transition once the full text has landed
GrowMs=250
; Time (ms) to hold at final size/color before disappearing
HoldMs=2000
; Text color at the start of the reveal (R,G,B)
StartColor=255,0,0
; Text color once fully grown (R,G,B)
EndColor=255,255,0
; World-height units above the character's nameplate/HP bar to draw the bubble
VerticalOffset=50
