[ComboNameBubble]
; RevealMode: 0=CharByChar 1=WordByWord 2=SwordSlash 3=InkBlot
RevealMode=1
; Delay (ms) before each next word/char starts flying in
CharStaggerMs=40
; Time (ms) for one word/char to fly into place
CharFlyMs=180
; World-height units a word/char travels while flying in
FlyDistance=15
; Time (ms) for the size+color transition once the full text has landed
GrowMs=250
; Time (ms) to hold at final size/color before disappearing
HoldMs=2000
; Text color at the start of the reveal (R,G,B)
StartColor=255,0,0
; Text color once fully grown, fallback when the caster's series is unknown (R,G,B)
EndColor=255,255,0
; World-height units above the character's nameplate/HP bar to draw the bubble
VerticalOffset=50
; Spacing between characters/words only above font size 16 (the native fonts
; at 16 and below already sit at the engine's correct default spacing -- do
; not touch those, they're not adjustable and shrinking them just overlaps
; the letters). 100 = leave sizes above 16 unscaled too, lower pulls them
; tighter to compensate for how sparse the stretched bitmap glyphs get.
CharSpacing=70
; Font size while flying in / once fully grown. Only 10, 12, 13, 14, 16, 18,
; 20, 22, 24, 26, 28, 30 are registered (see Ui/Ui3/UiPubLicSetting.ini
; [FontList]) -- any other value gets snapped to the nearest one of those, so
; pick from that list directly. Sizes above 16 reuse the 16px glyph bitmap
; stretched larger (there's no higher-resolution font asset), so they look
; a bit softer/blockier the bigger they get.
; FontSizeStart can be higher than FontSizeEnd to shrink instead of grow.
FontSizeStart=12
FontSizeEnd=16

; "Grown" color per Ngu Hanh series (overrides EndColor above), matching the
; game's own <color=Metal>/<color=Wood>/<color=Water>/<color=Fire>/<color=Earth>
; chat tag colors (R,G,B)
EndColorMetal=246,255,117
EndColorWood=0,255,120
EndColorWater=78,124,255
EndColorFire=255,90,0
EndColorEarth=254,207,179
